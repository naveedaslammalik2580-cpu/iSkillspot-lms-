name: CI

# Runs on every pull request and on pushes to main.
# Uses a throwaway PostgreSQL service container — it never touches the
# shared Supabase project, and no production secrets are used anywhere
# in this workflow (the values below are local CI placeholders).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-placeholder-password
          POSTGRES_DB: iskillspot_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:ci-placeholder-password@localhost:5432/iskillspot_test_ci
      DIRECT_URL: postgresql://postgres:ci-placeholder-password@localhost:5432/iskillspot_test_ci
      # Placeholder only, so build-time code paths that read the variable
      # do not fail. Not a real credential; production values live in the
      # deployment environment, never in this repository.
      SESSION_SECRET: ci-placeholder-secret-0123456789abcdef

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Tests (unit + database integration)
        run: npm test

      - name: Production build
        run: npm run build
